services:
  postgres:
    image: postgres:17-alpine
    container_name: grs1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gestor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Nix100}
      POSTGRES_DB: ${DB_NAME:-turnos}
    networks:
      - grs1_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gestor} -d ${DB_NAME:-turnos}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - grs1_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-5432}:5432"

  migrate:
    image: postgres:17-alpine
    container_name: grs1-migrate
    profiles: ["bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      PGPASSWORD: ${DB_PASSWORD:-Nix100}
      DB_HOST: grs1-postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-gestor}
      DB_NAME: ${DB_NAME:-turnos}
      MIGRATIONS_DIR: /migrations
      DUMP_FILE: ${DUMP_FILE:-docker_dump.sql}
      PREFER_PLAIN_DUMP: ${PREFER_PLAIN_DUMP:-true}
      RESET_SCHEMA_BEFORE_PLAIN_DUMP: ${RESET_SCHEMA_BEFORE_PLAIN_DUMP:-false}
      APPLY_INCREMENTALS_AFTER_DUMP: ${APPLY_INCREMENTALS_AFTER_DUMP:-false}
      APPLY_INCREMENTALS_AFTER_CANONICAL: ${APPLY_INCREMENTALS_AFTER_CANONICAL:-false}
    volumes:
      - ${COMPOSE_BIND_ROOT:-.}/migrations:/migrations:ro
      - ${COMPOSE_BIND_ROOT:-.}/scripts/docker:/scripts/docker:ro
    command: ["sh", "/scripts/docker/run-migrations.sh"]
    networks:
      - grs1_net

  app:
    image: localhost/grs-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grs1-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.qnap.example
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: grs1-postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-gestor}
      DB_PASSWORD: ${DB_PASSWORD:-Nix100}
      DB_NAME: ${DB_NAME:-turnos}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-for-qnap}
      DEVENGOS_WORKER_ENABLED: ${DEVENGOS_WORKER_ENABLED:-true}
      DEVENGOS_WORKER_INTERVAL_MS: ${DEVENGOS_WORKER_INTERVAL_MS:-300000}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://127.0.0.1:3000/login.html',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - grs1_net

  nginx:
    image: nginx:1.27-alpine
    container_name: grs1-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-18080}:80"
    volumes:
      - ${COMPOSE_BIND_ROOT:-.}/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - grs1_net

  adminer:
    image: adminer:latest
    container_name: grs1-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-18081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: grs1-postgres
      ADMINER_DEFAULT_USER: ${DB_USER:-gestor}
      ADMINER_DEFAULT_DB: ${DB_NAME:-turnos}
    networks:
      - grs1_net

volumes:
  grs1_pgdata:

networks:
  grs1_net:
    driver: bridge
