<!DOCTYPE html>
<html>
<head>
  <title>CMS Help Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<h2>Help CMS</h2>

<form id="helpForm" class="mb-4">
  <input type="hidden" id="id">

  <input class="form-control mb-2" placeholder="Title" id="title">
  <textarea class="form-control mb-2" placeholder="Content" id="content"></textarea>

  <select class="form-control mb-2" id="type">
    <option value="tooltip">Tooltip</option>
    <option value="modal">Modal</option>
    <option value="page">Page</option>
  </select>

  <input class="form-control mb-2" placeholder="Context" id="context">

  <button class="btn btn-primary">Save</button>
</form>

<table class="table">
  <thead>
    <tr>
      <th>ID</th><th>Title</th><th>Context</th><th>Actions</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script src="admin.js"></script>
</body>
</html>
