<div class="card shadow-sm mb-2">
    <div class="d-flex align-items-center gap-2 px-3 py-2 border-bottom bg-white flex-wrap">
        <i class="bi bi-lightning-charge text-secondary" style="font-size:.95rem"></i>
        <span class="fw-semibold text-dark" style="font-size:.875rem"> Agentes Acciones Masivas</span>
        <button class="btn btn-link p-0 ms-1" type="button" data-help-context="agentes-acciones-help"
            data-bs-toggle="modal" data-bs-target="#helpModal" title="Acciones Masivas - Ayuda">
            <i class="bi bi-question-circle text-secondary" style="font-size: 0.95rem"></i>
        </button>
        <span class="vr mx-1 opacity-25"></span>
        <span id="agentesAccionesGridBadge"
            class="badge bg-secondary-subtle text-secondary border border-secondary-subtle ms-1"
            style="font-size:.68rem">Sin datos</span>
        <div class="ms-auto d-flex align-items-center gap-1">
            <span class="vr mx-1 opacity-25"></span>
            <label class="text-info-emphasis px-2 mb-0">Altas / Modificaciones</label>
            <label class="btn btn-outline-secondary btn-sm py-1 px-2 mb-0" for="agentesAltasCsvInput"
                title="Cargar Fichero CSV de altas / Modificaciones" style="font-size:.78rem">
                <i class="bi bi-upload"></i> Carga CSV
            </label>
            <input id="agentesAltasCsvInput" type="file" accept=".csv,text/csv" class="d-none" />
            <button id="btnAgentesAltasEjecutar" class="btn btn-primary btn-sm py-1 px-2" disabled type="button"
                title="Ejecutar altas masivas" style="font-size:.78rem">
                <i class="bi bi-play-circle"></i> Ejecutar
            </button>
            <button id="btnAgentesAltasErroresCsv" class="btn btn-outline-secondary btn-sm py-1 px-2" disabled
                type="button" title="Descargar errores de la última ejecución" style="font-size:.78rem">
                <i class="bi bi-download"></i> Errores CSV
            </button>

            <span class="vr mx-1 opacity-25"></span>
            <label class="text-info-emphasis px-2 mb-0">Bajas</label>
            <label class="btn btn-outline-secondary btn-sm py-1 px-2 mb-0" for="agentesBajasCsvInput"
                title="Cargar CSV de bajas (columna TIP)" style="font-size:.78rem">
                <i class="bi bi-filetype-csv"></i> CSV Bajas
            </label>
            <input id="agentesBajasCsvInput" type="file" accept=".csv,text/csv" class="d-none" />
            <button id="btnAgentesBajasCsvEjecutar" class="btn btn-outline-danger btn-sm py-1 px-2" disabled
                type="button" style="font-size:.78rem">
                <i class="bi bi-play-circle"></i> Ejecutar
            </button>

            <span class="vr mx-1 opacity-25"></span>
            <label class="text-info-emphasis px-2 mb-0">Bajas Manuales</label>
            <button id="btnAgentesBajasDesdeSeleccion" class="btn btn-outline-secondary btn-sm py-1 px-2" type="button"
                title="Cargar lista de agentes activos" style="font-size:.78rem">
                <i class="bi bi-people"></i> Cargar Agentes
            </button>
            <button id="btnAgentesBajasSeleccionEjecutar" class="btn btn-danger btn-sm py-1 px-2" disabled type="button"
                style="font-size:.78rem">
                <i class="bi bi-person-x"></i> Baja Selección
            </button>



            <button class="btn btn-outline-secondary btn-sm py-1 px-2" data-section-trigger="agentes" type="button"
                title="Ir a Lista de Agentes">
                <i class="bi bi-people"></i>
            </button>
            <button class="btn btn-outline-secondary btn-sm py-1 px-2" data-section-trigger="dashboard" type="button"
                title="Ir al Dashboard">
                <i class="bi bi-house"></i>
            </button>
        </div>
    </div>

    <div id="alertContainerAgentesAcciones" class="px-2 pt-1"></div>
    <div id="estadoCargaAgentesAcciones" class="d-none"></div>

    <div id="agentesAccionesColumnasHelp" class="px-3 py-2 border-bottom bg-danger-subtle text-info-emphasis small">

    </div>

    <!-- Grid único multipropósito -->
    <div class="px-2 pb-2 pt-1">
        <div id="tabulatorAgentesMainGrid" class="border rounded" style="min-height:120px"></div>
    </div>
</div>
