<div class="d-flex justify-content-between align-items-center mb-2">
  <div class="d-flex align-items-center gap-2">
    <h2 class="mb-0 fs-5">Asignación de Servicios</h2>
    <span id="asignacionesEstadoPeriodo" class="badge bg-light text-dark border flex-shrink-0"
      style="font-size: 0.95rem; padding: 0.4rem 0.65rem">sin datos</span>
  </div>
  <button class="btn btn-outline-secondary btn-sm px-2 py-1" data-section-trigger="dashboard" type="button">
    <i class="bi bi-house"></i> Dashboard
  </button>
</div>

<div class="card shadow-sm mb-2">
  <div class="card-header py-1 px-2">
    <div class="d-flex align-items-center gap-1 flex-nowrap overflow-visible">
      <!-- Año / Mes: ocultos, se rellenan desde el cuadrante seleccionado -->
      <input id="asigAnio" type="number" class="visually-hidden" aria-hidden="true" tabindex="-1" />
      <select id="asigMes" class="visually-hidden" aria-hidden="true" tabindex="-1"></select>

      <!-- Cuadrante definido (después del mes) -->
      <i class="bi bi-calendar3-week text-muted flex-shrink-0 ms-1"></i>
      <span class="text-muted flex-shrink-0" style="font-size: 0.8rem">Cuadrante</span>
      <button class="btn btn-link p-0 ms-1" type="button" data-help-context="asignaciones-help"
        title="Asignación Servicios">
        <i class="bi bi-question-circle text-secondary" style="font-size: 0.95rem"></i>
      </button>
      <select id="asigCuadrante" class="form-select form-select-sm flex-shrink-0 asig-sel-cuadrante"
        title="Cuadrantes Definidos">
        <option value="">— Sin cuadrantes —</option>
      </select>
      <button id="btnGestionCuadrantes" class="btn btn-outline-secondary btn-sm px-2 flex-shrink-0 d-none"
        title="Gestionar cuadrantes">
        <i class="bi bi-gear"></i>
      </button>

      <!-- Separador visual -->
      <div class="vr mx-1 flex-shrink-0"></div>

      <!-- Borrador -->
      <select id="asigBorrador" class="form-select form-select-sm flex-shrink-0 asig-sel-borrador"
        title="Borrador activo"></select>
      <span id="asigPeriodoCerradoBadge" class="badge text-bg-warning d-none flex-shrink-0"
        title="Período cerrado por borrador canónico" style="font-size: 0.72rem">Período cerrado</span>
      <button class="btn btn-outline-secondary btn-sm px-2 py-1 flex-shrink-0" id="btnEditObservacionesBorrador"
        type="button" title="Ver/editar observaciones del borrador">
        <i class="bi bi-chat-left-text"></i>
      </button>
      <button class="btn btn-outline-dark btn-sm px-2 py-1 flex-shrink-0" id="btnAsigNuevoBorrador"
        data-permiso="asignaciones:crear" type="button" title="Nuevo borrador">
        <i class="bi bi-plus-circle"></i>
      </button>
      <button class="btn btn-outline-danger btn-sm px-2 py-1 flex-shrink-0" id="btnAsigDeleteBorrador"
        data-permiso="asignaciones:eliminar" type="button" title="Eliminar borrador">
        <i class="bi bi-trash"></i>
      </button>

      <!-- Acciones al extremo derecho -->
      <div class="ms-auto d-flex gap-1 flex-shrink-0">
        <!-- Exportación en dropdown (ids conservados para handlers JS) -->
        <div class="dropdown" id="asigExportDropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown"
            aria-label="Exportar" aria-expanded="false" title="Exportar">
            <i class="bi bi-download"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <button class="dropdown-item" id="btnExportExcelAsig" type="button">
                <i class="bi bi-file-earmark-excel me-2"></i>Excel
              </button>
            </li>
            <li>
              <button class="dropdown-item" id="btnExportPdfAsig" type="button">
                <i class="bi bi-file-earmark-pdf me-2"></i>PDF
              </button>
            </li>
          </ul>
        </div>
        <button class="btn btn-outline-primary btn-sm" id="btnAsigBulk" data-permiso="asignaciones:crear" type="button"
          title="Asignación masiva">
          <i class="bi bi-grid-3x3-gap"></i>
        </button>
        <button class="btn btn-outline-danger btn-sm" id="btnAsigDelete" data-permiso="asignaciones:eliminar"
          type="button" title="Eliminar asignaciones">
          <i class="bi bi-eraser"></i>
        </button>
        <button class="btn btn-outline-secondary btn-sm" id="btnAsigCopy" type="button" title="Copiar mes">
          <i class="bi bi-files"></i>
        </button>
        <button class="btn btn-outline-info btn-sm" id="btnAsigHistorial" type="button" title="Historial de cambios">
          <i class="bi bi-clock-history"></i>
        </button>

        <button class="btn btn-outline-warning btn-sm" id="btnAsigConsolidarDevengos" data-permiso="asignaciones:crear"
          type="button" title="Consolidar devengos (recalcular)">
          <i class="bi bi-lightning-charge"></i>
        </button>
        <button class="btn btn-success btn-sm" id="btnAsigValidate" data-permiso="asignaciones:validar" type="button"
          title="Validar borrador">
          <i class="bi bi-check2-circle"></i>
        </button>
        <button class="btn btn-primary btn-sm" id="btnReloadAsignaciones" type="button" title="Recargar cuadrante">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
    </div>
  </div>

  <div id="alertContainerAsignaciones" class="px-3 pt-2 asig-alert-slot"></div>

  <div class="card-body pt-1 pb-1">
    <div class="row g-1" id="asigMetaResumen"></div>
  </div>

  <div class="card-body pt-0 pb-1">
    <div class="row g-1 align-items-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="input-group input-group-sm">
          <span class="input-group-text" aria-hidden="true"><i class="bi bi-search"></i></span>
          <input id="asigSearchAgente" class="form-control form-control-sm" type="search"
            placeholder="Buscar contenido en la tabla" aria-label="Buscar agente por nombre, apellidos o TIP"
            autocomplete="off" />
          <button id="asigClearAllFilters" class="btn btn-outline-secondary" type="button"
            title="Limpiar todos los filtros" aria-label="Limpiar todos los filtros">
            <i class="bi bi-eraser"></i><span> Filtros</span>
          </button>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="asig-actividad-filter">
          <button id="asigActividadFilterToggle" type="button"
            class="btn btn-outline-secondary btn-sm w-100 d-flex align-items-center justify-content-between"
            aria-expanded="false" aria-controls="asigActividadFilterPanel" data-bs-toggle="tooltip"
            data-bs-placement="top" title="Filtro de Actividad por fecha">
            <span class="d-inline-flex align-items-center gap-1">
              <i class="bi bi-funnel"></i>
              <span>Actividades</span>
            </span>
            <span id="asigActividadFilterCount" class="badge text-bg-secondary">0</span>
          </button>

          <div id="asigActividadFilterPanel" class="asig-actividad-filter-panel d-none">
            <div class="asig-actividad-filter-toolbar">
              <input id="asigActividadFilterSearch" type="text" class="form-control form-control-sm"
                placeholder="Buscar actividad..." autocomplete="off" />
              <button id="asigActividadFilterApply" type="button" class="btn btn-sm btn-primary"
                title="Aplicar filtro de actividades">
                Filtrar
              </button>
              <button id="asigActividadFilterClear" type="button" class="btn btn-sm btn-outline-secondary"
                title="Limpiar actividades marcadas">
                Limpiar
              </button>
            </div>
            <div class="row g-2 mt-1 px-1">
              <div class="col-6">
                <label for="asigActividadFilterFechaInicio" class="form-label mb-1 small text-muted">Fecha
                  inicio</label>
                <input id="asigActividadFilterFechaInicio" type="date" class="form-control form-control-sm"
                  title="Fecha inicial para filtrar actividades" />
              </div>
              <div class="col-6">
                <label for="asigActividadFilterFechaFin" class="form-label mb-1 small text-muted">Fecha fin</label>
                <input id="asigActividadFilterFechaFin" type="date" class="form-control form-control-sm"
                  title="Fecha final para filtrar actividades" />
              </div>
            </div>
            <div id="asigActividadFilterList" class="asig-actividad-filter-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card-body p-0">
    <div id="asigGridContainer" class="table-responsive" style="max-height: calc(100vh - 320px); overflow: auto"></div>
  </div>

  <style>
    #asigGridContainer table.table-sm th,
    #asigGridContainer table.table-sm td {
      padding: 0.25rem 0.5rem !important;
      font-size: 0.95em;
    }

    .card-header,
    .card-body {
      font-size: 0.97em;
    }

    .form-select-sm,
    .form-control-sm {
      font-size: 0.97em;
      padding-top: 0.15rem;
      padding-bottom: 0.15rem;
    }

    /* Reservar espacio fijo para mensajes y evitar salto vertical del grid */
    #alertContainerAsignaciones.asig-alert-slot {
      min-height: 44px;
    }

    #alertContainerAsignaciones.asig-alert-slot .alert {
      margin-bottom: 0;
    }

    /*
   * FIX sticky header:
   * border-collapse:collapse (Bootstrap default) es incompatible con
   * position:sticky — las celdas del body sangran por detrás del thead.
   * Solución: border-collapse:separate  border-spacing:0 y re-declarar
   * los bordes manualmente.
   */
    #asigGridContainer table {
      border-collapse: separate !important;
      border-spacing: 0 !important;
    }

    /* Restaurar bordes: con border-separate cada celda necesita los suyos */
    #asigGridContainer th,
    #asigGridContainer td {
      border-top: 0 !important;
      border-left: 0 !important;
      border-right: 1px solid #dee2e6 !important;
      border-bottom: 1px solid #dee2e6 !important;
    }

    #asigGridContainer thead tr:first-child th {
      border-top: 1px solid #dee2e6 !important;
    }

    #asigGridContainer th:first-child,
    #asigGridContainer td:first-child {
      border-left: 1px solid #dee2e6 !important;
    }

    /* Sticky sobre cada <th> del thead (no sobre <thead>) */
    #asigGridContainer thead th {
      position: sticky !important;
      top: 0;
      z-index: 10;
      background-color: #f1f3f4;
      background-clip: padding-box !important;
    }
  </style>
</div>

<!-- ── Modal: nuevo borrador ───────────────────────────────── -->
<div class="modal fade" id="modalNuevoBorrador" tabindex="-1" aria-labelledby="modalNuevoBorradorLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-notion">
      <div class="modal-header">
        <h5 class="modal-title" id="modalNuevoBorradorLabel">
          <i class="bi bi-plus-circle me-2"></i>Nuevo borrador
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="nuevoCopiaDesdeBorrador">
            Copiar desde <span class="text-muted small">(opcional)</span>
          </label>
          <select class="form-select" id="nuevoCopiaDesdeBorrador">
            <option value="">— Empezar vacío —</option>
          </select>
        </div>
        <div class="mb-1">
          <label class="form-label" for="nuevoObservacionesBorrador">Observaciones
            <span class="text-muted small">(opcional)</span></label>
          <textarea class="form-control" id="nuevoObservacionesBorrador" rows="2" maxlength="500"
            placeholder="Notas sobre este borrador…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button type="button" class="btn btn-primary" id="btnConfirmarNuevoBorrador">
          <i class="bi bi-plus-circle me-1"></i>Crear
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal edición de observaciones de borrador -->
<div class="modal fade" id="modalObservacionesBorrador" tabindex="-1" aria-labelledby="modalObservacionesBorradorLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-notion">
      <div class="modal-header">
        <h5 class="modal-title" id="modalObservacionesBorradorLabel">
          <i class="bi bi-chat-left-text me-2"></i><span id="obsModalTitulo">Borrador</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <textarea class="form-control" id="editObservacionesBorrador" rows="4" maxlength="500"
          placeholder="Notas sobre este borrador…"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button type="button" class="btn btn-primary" id="btnGuardarObservacionesBorrador">
          <i class="bi bi-floppy me-1"></i>Guardar
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalHistorialAsignaciones" tabindex="-1" aria-labelledby="modalHistorialAsignacionesLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content modal-notion">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="modalHistorialAsignacionesLabel">
            <i class="bi bi-clock-history me-2"></i>Historial del cuadrante
          </h5>
          <div id="asigHistorialModalSubtitulo" class="small text-white-50 mt-1"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="row g-2 mb-3">
          <!-- Fila 1: Acción · Fecha cuadrante · Fecha de cambio -->
          <div class="col-12 col-md-4">
            <label class="form-label small mb-1">Acción</label>
            <div id="asigHistorialFiltroAccion" style="
                max-height: 130px;
                overflow-y: auto;
                border: 1px solid #dee2e6;
                border-radius: 0.375rem;
                padding: 4px 6px;
                background: #fff;
                font-size: 0.8rem;
              ">
              <!-- checkboxes generados por JS -->
            </div>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label small mb-1" for="asigHistorialFiltroFechaCuadrante">Fecha cuadrante</label>
            <div id="asigHistorialFiltroFechaCuadrante" style="
                max-height: 130px;
                overflow-y: auto;
                border: 1px solid #dee2e6;
                border-radius: 0.375rem;
                padding: 4px 6px;
                background: #fff;
                font-size: 0.8rem;
              ">
              <!-- checkboxes generados por JS -->
            </div>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label small mb-1" for="asigHistorialFiltroFechaCambio">Fecha de cambio</label>
            <div id="asigHistorialFiltroFechaCambio" style="
                max-height: 130px;
                overflow-y: auto;
                border: 1px solid #dee2e6;
                border-radius: 0.375rem;
                padding: 4px 6px;
                background: #fff;
                font-size: 0.8rem;
              ">
              <!-- checkboxes generados por JS -->
            </div>
          </div>
          <!-- Fila 2: Usuario -->
          <div class="col-12 col-md-4">
            <label class="form-label small mb-1" for="asigHistorialFiltroUsuario">Usuario</label>
            <select class="form-select form-select-sm" id="asigHistorialFiltroUsuario">
              <option value="">Todos los usuarios</option>
            </select>
          </div>
          <div class="col-12 col-md-4 d-flex align-items-end">
            <div class="form-check mb-1">
              <input class="form-check-input" type="checkbox" id="asigHistorialIncluirComunicados" />
              <label class="form-check-label small" for="asigHistorialIncluirComunicados">
                Repetir Comunicados
              </label>
            </div>
          </div>
          <div class="col-12 d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnAsigHistorialLimpiarFiltros">
              Limpiar filtros
            </button>
            <button type="button" class="btn btn-primary btn-sm" id="btnAsigHistorialAplicarFiltros">
              <i class="bi bi-search me-1"></i>Consultar
            </button>
          </div>
        </div>
        <div id="asigHistorialResumen" class="mb-3"></div>
        <div id="asigHistorialContent">
          <div class="text-center text-muted py-4">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
            Cargando historial...
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-success" id="btnAsigHistorialExcel" disabled>
          <i class="bi bi-file-earmark-excel me-1"></i>Exportar Excel plano
        </button>
        <button type="button" class="btn btn-outline-secondary" id="btnAsigHistorialPdf">
          <i class="bi bi-file-earmark-pdf me-1"></i>Exportar y Marcar comunicados
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="modalConsolidarDevengos" tabindex="-1" aria-labelledby="modalConsolidarDevengosLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-notion">
      <div class="modal-header">
        <h5 class="modal-title" id="modalConsolidarDevengosLabel">
          <i class="bi bi-lightning-charge me-2"></i>Consolidar devengos
        </h5>

        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>

      <div class="modal-body">
        <div id="asigConsolidarDevengosModalContext" class="mb-2">
          Se recalcularán los devengos para el borrador seleccionado.
        </div>

        <div id="asigConsolidarDevengosProgressWrap" class="mb-3 d-none">
          <div class="progress" role="progressbar" aria-label="Progreso de consolidación de devengos" aria-valuemin="0"
            aria-valuemax="100">
            <div id="asigConsolidarDevengosProgressBar"
              class="progress-bar progress-bar-striped progress-bar-animated bg-warning"
              style="width: 30%; transition: width 0.3s ease-in-out" aria-valuenow="30">
              30%
            </div>
          </div>
          <div id="asigConsolidarDevengosProgressText" class="form-text mt-1">
            Listo para iniciar.
          </div>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="asigConsolidarDevengosAceptarSwitch" />

          <label class="form-check-label" for="asigConsolidarDevengosAceptarSwitch">
            <span class="ms-2 badge bg-secondary" id="asigConsolidarDevengosAceptarLabel">No</span>
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>

        <button type="button" class="btn btn-warning" id="btnConfirmAsigConsolidarDevengos" disabled>
          <i class="bi bi-lightning-charge me-1"></i>Consolidar
        </button>
      </div>
    </div>
  </div>
</div>
