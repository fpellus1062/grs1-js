<div class="card shadow-sm mb-2">
  <!-- Notion-style compact toolbar -->
  <div
    class="d-flex align-items-center gap-2 px-3 py-2 border-bottom bg-white flex-wrap"
  >
    <i class="bi bi-diagram-3 text-secondary" style="font-size: 0.95rem"></i>
    <span class="fw-semibold text-dark" style="font-size: 0.875rem"
      >Servicios</span
    >
    <button class="btn btn-link p-0 ms-1" type="button" data-help-context="lista-servicios-help" title="Ayuda Lista de Servicios">
      <i class="bi bi-question-circle text-secondary" style="font-size: 0.95rem"></i>
    </button>
    <span class="vr mx-1 opacity-25"></span>
    <span class="text-muted" style="font-size: 0.75rem">
      <strong id="totalRecordsActividad">0</strong> total &middot;
      <strong id="filteredRecordsActividad">0</strong> filtrados &middot;
      <strong id="shownRecordsActividad">0</strong> ocultos
    </span>
    <div class="ms-auto d-flex align-items-center gap-1">
      <div class="dropdown">
        <button
          class="btn btn-outline-secondary btn-sm dropdown-toggle py-1 px-2"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          title="Exportar"
          style="font-size: 0.78rem"
        >
          <i class="bi bi-download"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <button
              class="dropdown-item"
              id="btnExportExcelActividad"
              type="button"
            >
              <i class="bi bi-file-earmark-excel me-2"></i>Excel
            </button>
          </li>
          <li>
            <button
              class="dropdown-item"
              id="btnExportPdfActividad"
              type="button"
            >
              <i class="bi bi-file-earmark-pdf me-2"></i>PDF
            </button>
          </li>
        </ul>
      </div>
      <button
        class="btn btn-primary btn-sm py-1 px-2"
        id="btnAgregarNuevaActividad"
        data-permiso="actividades:crear"
        title="Nueva actividad"
        type="button"
        style="font-size: 0.78rem"
      >
        <i class="bi bi-plus-circle"></i> Nuevo
      </button>
      <button
        class="btn btn-outline-secondary btn-sm py-1 px-2"
        data-section-trigger="dashboard"
        type="button"
        title="Ir al Dashboard"
      >
        <i class="bi bi-house"></i>
      </button>
    </div>
  </div>

  <div
    class="save-changes-section pending-changes-idle"
    id="saveChangesSectionActividad"
  >
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <i class="bi bi-pencil-square me-1"></i
        ><strong>Cambios pendientes:</strong>
        <span id="pendingChangesCountActividad">0</span> fila(s)
      </div>
      <div>
        <button
          class="btn btn-success btn-sm me-2"
          id="btnSaveAllChangesActividad"
          type="button"
          disabled
        >
          <i class="bi bi-check-circle"></i> Guardar Cambios
        </button>
        <button
          class="btn btn-outline-secondary btn-sm"
          id="btnDiscardChangesActividad"
          type="button"
          disabled
        >
          <i class="bi bi-x-circle"></i> Descartar
        </button>
      </div>
    </div>
  </div>

  <div id="alertContainerActividad" class="px-2 pt-1"></div>

  <div class="card-body p-0">
    <div id="tabulatorActividades"></div>
  </div>
</div>
