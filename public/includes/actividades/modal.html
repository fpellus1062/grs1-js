<div class="modal fade" id="actividadModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content modal-notion">
      <div class="modal-header">
        <h5 class="modal-title" id="actividadModalTitle">
          Agregar Nuevo Servicio
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Cerrar"
        ></button>
      </div>
      <div class="modal-body">
        <form id="actividadForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="actividadCodigo" class="form-label">Servicio</label>
              <input
                type="text"
                class="form-control"
                id="actividadCodigo"
                maxlength="255"
              />
            </div>
            <div class="col-md-6">
              <label for="actividadNombre" class="form-label">Nombre *</label>
              <input
                type="text"
                class="form-control"
                id="actividadNombre"
                required
                minlength="2"
                maxlength="255"
              />
            </div>
            <div class="col-md-4">
              <label for="actividadDisponible" class="form-label"
                >Disponible</label
              >
              <select class="form-control" id="actividadDisponible">
                <option value="">Sin marca</option>
                <option value="--a--">--a--</option>
                <option value="--d--">--d--</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="actividadGrupoId" class="form-label">Grupo ID</label>
              <select class="form-control" id="actividadGrupoId">
                <option value="">Sin grupo</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="actividadHorario" class="form-label">Horario</label>
              <input
                type="text"
                class="form-control"
                id="actividadHorario"
                maxlength="255"
              />
            </div>
            <div class="col-md-6">
              <label for="actividadHoraInicio" class="form-label"
                >Hora inicio *</label
              >
              <input
                type="time"
                class="form-control"
                id="actividadHoraInicio"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="actividadHoraFin" class="form-label"
                >Hora fin *</label
              >
              <input
                type="time"
                class="form-control"
                id="actividadHoraFin"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="actividadColor" class="form-label">Color</label>
              <div class="d-flex align-items-center gap-2">
                <input
                  type="color"
                  class="form-control form-control-color"
                  id="actividadColor"
                  value="#6c757d"
                  title="Elige un color"
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary btn-sm"
                  id="btnClearActividadColor"
                  title="Restablecer color"
                >
                  <i class="bi bi-x-circle"></i>
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button type="button" class="btn btn-primary" id="btnSaveActividad">
          Guardar
        </button>
      </div>
    </div>
  </div>
</div>
