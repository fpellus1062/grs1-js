<div class="modal fade" id="changePasswordModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content modal-notion">
      <div class="modal-header">
        <h5 class="modal-title">Cambiar Contraseña</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form id="changePasswordForm" novalidate>

          <div class="notion-section-title">Contraseña</div>
          <div class="mb-3">
            <label for="cpCurrentPassword" class="form-label">Contraseña actual *</label>
            <div class="input-group">
              <input type="password" class="form-control" id="cpCurrentPassword" required>
              <button class="btn btn-outline-secondary" type="button" data-toggle-password="cpCurrentPassword" title="Mostrar/ocultar">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-3">
            <label for="cpNewPassword" class="form-label">Nueva contraseña *</label>
            <div class="input-group">
              <input type="password" class="form-control" id="cpNewPassword" required minlength="12" maxlength="72"
                     placeholder="Mín. 12 caracteres">
              <button class="btn btn-outline-secondary" type="button" data-toggle-password="cpNewPassword" title="Mostrar/ocultar">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div id="cpPasswordStrength" class="mt-1" style="display:none;">
              <div class="progress" style="height: 4px;">
                <div id="cpPasswordStrengthBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
              </div>
              <small id="cpPasswordStrengthText" class="text-muted"></small>
            </div>
            <div class="form-text text-muted" style="font-size:.75rem">Mayúscula, minúscula, número y carácter especial</div>
          </div>
          <div class="mb-3">
            <label for="cpConfirmPassword" class="form-label">Confirmar nueva contraseña *</label>
            <div class="input-group">
              <input type="password" class="form-control" id="cpConfirmPassword" required minlength="12" maxlength="72">
              <button class="btn btn-outline-secondary" type="button" data-toggle-password="cpConfirmPassword" title="Mostrar/ocultar">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div id="cpAlertContainer"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnSaveChangePassword">Cambiar Contraseña</button>
      </div>
    </div>
  </div>
</div>
