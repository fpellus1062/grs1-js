<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0 fs-5"></h2>
  <button
    class="btn btn-outline-secondary btn-sm px-2 py-1"
    data-section-trigger="dashboard"
    type="button"
  >
    <i class="bi bi-house"></i> Dashboard
  </button>
</div>

<div class="card shadow-sm mb-2">
  <div
    class="card-header py-1 px-2 d-flex justify-content-between align-items-center"
  >
    <div class="d-flex align-items-center gap-2">
      <h4 class="mb-0">Listado de Agente</h4>
      <span id="testTabulatorRoleBadge" class="badge bg-secondary">API</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <small class="text-dark-emphasis opacity-75">
        Total: <strong id="testTabulatorTotalRecords">0</strong> | Filtrados:
        <strong id="testTabulatorFilteredRecords">0</strong> | Ocultos:
        <strong id="testTabulatorHiddenRecords">0</strong>
      </small>
      <div class="btn-group btn-group-sm" id="testTabulatorQuickFilterEstado">
        <button
          type="button"
          class="btn btn-outline-secondary dropdown-toggle"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <i class="bi bi-funnel"></i> Baja?:
          <span id="testTabulatorEstadoLabel">Todos</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <a class="dropdown-item active" href="#" data-estado="todos"
              >Todos</a
            >
          </li>
          <li>
            <a class="dropdown-item" href="#" data-estado="activos">Activos</a>
          </li>
          <li>
            <a class="dropdown-item" href="#" data-estado="baja">De baja</a>
          </li>
        </ul>
      </div>
      <button
        class="btn btn-primary btn-sm"
        id="btnTestTabulatorNuevoAgente"
        title="Crear nuevo agente"
        type="button"
      >
        <i class="bi bi-person-plus"></i> Nuevo agente
      </button>
      <button
        class="btn btn-outline-secondary btn-sm"
        id="btnTestTabulatorAsignacionesDetalle"
        title="Ver cuadrante del agente seleccionado"
        type="button"
      >
        <i class="bi bi-calendar3-week"></i> Cuadrante
      </button>
      <button
        class="btn btn-outline-secondary btn-sm"
        id="btnTestTabulatorRecargarCsv"
        type="button"
        title="Recargar desde API de agentes"
      >
        <i class="bi bi-arrow-repeat"></i> Recargar API
      </button>
      <div class="dropdown">
        <button
          class="btn btn-outline-secondary btn-sm dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <i class="bi bi-download"></i> Exportar
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <button
              class="dropdown-item"
              id="btnTestTabulatorExportBase"
              type="button"
            >
              <i class="bi bi-file-earmark-excel me-2"></i>Excel
            </button>
          </li>
          <li>
            <button
              class="dropdown-item"
              id="btnTestTabulatorExportVisible"
              type="button"
            >
              <i class="bi bi-file-earmark-pdf me-2"></i>PDF
            </button>
          </li>
        </ul>
      </div>
      <label class="btn btn-primary btn-sm mb-0" for="testTabulatorCsvInput">
        <i class="bi bi-upload"></i> Cargar CSV (opcional)
      </label>
      <input
        id="testTabulatorCsvInput"
        type="file"
        accept=".csv,text/csv"
        class="d-none"
      />
    </div>
  </div>

  <div
    class="save-changes-section pending-changes-idle"
    id="testTabulatorSaveChangesSection"
  >
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <i class="bi bi-pencil-square me-1"></i
        ><strong>Cambios pendientes:</strong>
        <span id="testTabulatorPendingCount">0</span>
      </div>
      <div>
        <button
          class="btn btn-success btn-sm me-2"
          id="btnTestTabulatorSaveAll"
          type="button"
        >
          <i class="bi bi-check-circle"></i> Guardar cambios
        </button>
        <button
          class="btn btn-outline-secondary btn-sm"
          id="btnTestTabulatorDiscard"
          type="button"
        >
          <i class="bi bi-x-circle"></i> Descartar
        </button>
      </div>
    </div>
  </div>

  <div id="testTabulatorAlert" class="px-3 pt-2"></div>
  <div class="px-3 pt-2 pb-1">
    <small id="testTabulatorEstadoCarga" class="text-muted"></small>
  </div>

  <div class="card-body p-0">
    <div
      id="tabulatorAgentesCsvTest"
      class="table-responsive"
      style="max-height: calc(100vh - 330px); overflow: auto"
    ></div>
  </div>

  <style>
    .modal-fullheight .modal-content {
      height: calc(100vh - 3.5rem);
      max-height: calc(100vh - 3.5rem);
    }

    .modal-fullheight .modal-body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .agente-asignaciones-detalle-grid-container {
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .agente-asig-card {
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      flex-shrink: 0;
    }

    .agente-asig-card-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .agente-asig-card-item {
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      background: #fff;
      padding: 0.4rem 0.6rem;
    }

    .agente-asig-card-label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      margin-bottom: 0.2rem;
    }

    .agente-asig-card-value {
      display: block;
      color: #0f172a;
      font-weight: 600;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .agente-asig-calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: auto;
      grid-auto-rows: minmax(0, 1fr);
      gap: 0.3rem;
      flex: 1 1 0;
      min-height: 0;
    }

    .agente-asig-calendar-head {
      text-align: center;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      letter-spacing: 0.03em;
      padding: 0.15rem 0;
      align-self: center;
    }

    .agente-asig-calendar-cell {
      min-height: 0;
      border: 1px solid #dbe2ea;
      border-radius: 0.5rem;
      background: #fff;
      padding: 0.25rem 0.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      overflow: hidden;
    }

    .agente-asig-calendar-cell.is-empty {
      background: transparent;
      border-style: dashed;
      border-color: #e5e7eb;
    }

    .agente-asig-calendar-cell.is-traspaso {
      background: #f8fafc;
    }

    .agente-asig-calendar-cell.is-festivo {
      border-color: #fecaca;
      background: #fff7f7;
    }

    .agente-asig-calendar-cell.is-weekend {
      background: #fffdf5;
    }

    .agente-asig-calendar-day {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.4rem;
    }

    .agente-asig-calendar-daynum {
      font-size: 0.8rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1;
    }

    .agente-asig-calendar-daymeta {
      text-align: right;
      font-size: 0.58rem;
      color: #64748b;
      line-height: 1.1;
    }

    .agente-asig-calendar-services {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      overflow: hidden;
    }

    .agente-asig-service {
      border-radius: 0.4rem;
      padding: 0.2rem 0.35rem;
      font-size: 0.62rem;
      line-height: 1.15;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .agente-asig-service-group {
      display: block;
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      opacity: 0.9;
      margin-bottom: 0.06rem;
    }

    .agente-asig-service-label {
      display: block;
      font-weight: 600;
      font-size: 0.62rem;
    }

    .agente-asig-calendar-obs {
      margin-top: auto;
      padding-top: 0.1rem;
      font-size: 0.58rem;
      color: #0f4c81;
      border-top: 1px dashed #dbe2ea;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agente-asig-calendar-empty {
      color: #94a3b8;
      font-size: 0.6rem;
      margin-top: 0.1rem;
    }

    .agente-asig-fuente-select {
      min-width: 150px;
    }

    .agente-asig-borrador-select {
      min-width: 250px;
    }

    .agente-asig-anio-value {
      min-width: 90px;
    }

    .agente-asig-mes-select {
      min-width: 150px;
    }

    @media (max-width: 991px) {
      .agente-asig-card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .agente-asig-calendar {
        min-width: 760px;
      }

      .agente-asignaciones-detalle-grid-container {
        overflow-x: auto;
      }
    }

    @media (max-width: 575px) {
      .agente-asig-card-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>

  <div
    class="modal fade"
    id="modalAgenteAsignacionesDetalle"
    tabindex="-1"
    aria-labelledby="modalAgenteAsignacionesDetalleLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-xl modal-dialog-centered modal-fullheight">
      <div class="modal-content modal-notion">
        <div class="modal-header">
          <div>
            <h5 class="modal-title" id="modalAgenteAsignacionesDetalleLabel">
              <i class="bi bi-calendar3-week me-2"></i>Cuadrante del agente
            </h5>
            <div
              id="agenteAsignacionesDetalleSubtitulo"
              class="small text-white-50 mt-1"
            ></div>
          </div>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Cerrar"
          ></button>
        </div>
        <div class="modal-body">
          <div class="d-flex flex-wrap align-items-end gap-2 mb-3">
            <div>
              <label class="form-label fw-semibold mb-1 small">Fuente</label>
              <select
                id="agenteAsigDetalleFuente"
                class="form-select form-select-sm agente-asig-fuente-select"
                title="Fuente de datos"
              >
                <option value="borrador">Borrador</option>
                <option value="definitivo">Definitivo</option>
              </select>
            </div>
            <div>
              <label class="form-label fw-semibold mb-1 small">Año</label>
              <select
                id="agenteAsigDetalleAnio"
                class="form-select form-select-sm agente-asig-anio-value"
                title="Año"
              ></select>
            </div>
            <div>
              <label class="form-label fw-semibold mb-1 small">Mes</label>
              <select
                id="agenteAsigDetalleMes"
                class="form-select form-select-sm agente-asig-mes-select"
                title="Mes"
              ></select>
            </div>
            <div id="agenteAsigDetalleBorradorWrap">
              <label class="form-label fw-semibold mb-1 small">Borrador</label>
              <select
                id="agenteAsigDetalleBorrador"
                class="form-select form-select-sm agente-asig-borrador-select"
                title="Borrador"
              >
                <option value="">Cargando borradores...</option>
              </select>
            </div>
          </div>
          <div
            id="agenteAsignacionesDetalleGridContainer"
            class="table-responsive agente-asignaciones-detalle-grid-container"
          >
            <div class="text-center text-muted py-4">
              Seleccione un único agente para visualizar su cuadrante.
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cerrar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
