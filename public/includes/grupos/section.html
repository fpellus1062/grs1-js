<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Grupos de Servicio</h2>
  <button class="btn btn-outline-secondary" data-section-trigger="dashboard" type="button">
    <i class="bi bi-house"></i> Volver al Dashboard
  </button>
</div>

<div class="card shadow">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0 text-dark-emphasis">Grupos de Servicio</h5>
    <div class="d-flex gap-2 align-items-center">
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-download"></i> Exportar
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><button class="dropdown-item" id="btnExportExcelGrupo" type="button"><i class="bi bi-file-earmark-excel"></i> Excel</button></li>
          <li><button class="dropdown-item" id="btnExportPdfGrupo" type="button"><i class="bi bi-file-earmark-pdf"></i> PDF</button></li>
        </ul>
      </div>
      <button class="btn btn-primary btn-sm" id="btnNuevoGrupo" type="button">
        <i class="bi bi-plus-circle"></i> Nuevo
      </button>
    </div>
  </div>
  <div class="save-changes-section pending-changes-idle" id="saveChangesGrupo">
    <div class="d-flex justify-content-between align-items-center">
      <div><i class="bi bi-pencil-square me-1"></i><strong>Cambios pendientes:</strong> <span id="pendingCountGrupo">0</span> fila(s)</div>
      <div>
        <button class="btn btn-success btn-sm me-2" id="btnSaveGrupo" type="button" disabled><i class="bi bi-check-circle"></i> Guardar</button>
        <button class="btn btn-outline-secondary btn-sm" id="btnDiscardGrupo" type="button" disabled><i class="bi bi-x-circle"></i> Descartar</button>
      </div>
    </div>
  </div>
  <div id="alertContainerGrupo" class="px-3 pt-2"></div>
  <div class="card-body p-0"><div id="tabulatorGrupos"></div></div>
</div>

<!-- Modal Confirmar Eliminación Grupo -->
<div class="modal fade" id="modalConfirmDeleteGrupo" tabindex="-1" role="dialog" aria-labelledby="modalConfirmDeleteGrupoLabel" aria-modal="true">
  <div class="modal-dialog modal-sm" role="document">
    <div class="modal-content modal-notion">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="modalConfirmDeleteGrupoLabel">Confirmar eliminación</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <p>¿Está seguro de que desea eliminar este grupo?</p>
        <p class="text-muted"><small>Esta acción no se puede deshacer.</small></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btnConfirmDeleteGrupo">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Nuevo Grupo -->
<div class="modal fade" id="modalNuevoGrupo" tabindex="-1" role="dialog" aria-labelledby="modalNuevoGrupoLabel" aria-modal="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content modal-notion">
      <div class="modal-header">
        <h5 class="modal-title" id="modalNuevoGrupoLabel">Nuevo Grupo de Servicio</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form id="formNuevoGrupo" novalidate>
          <div class="mb-3">
            <label for="nuevoGrupoNombre" class="form-label">Nombre *</label>
            <input type="text" class="form-control" id="nuevoGrupoNombre" required maxlength="100">
          </div>
          <div class="mb-3">
            <label for="nuevoGrupoColorHex" class="form-label">Color</label>
            <div class="notion-color-picker">
              <input type="color" class="form-control form-control-color" id="nuevoGrupoColor" value="#6c757d" title="Color grupo">
              <input type="text" class="form-control notion-color-hex" id="nuevoGrupoColorHex" maxlength="7" placeholder="#RRGGBB" pattern="^#[0-9a-fA-F]{6}$" value="#6c757d">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardarNuevoGrupo">Guardar</button>
      </div>
    </div>
  </div>
</div>
