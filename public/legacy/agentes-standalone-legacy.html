<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla obsoleta</title>
  <meta http-equiv="refresh" content="2; url=/dashboard.html">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    .card {
      width: min(640px, 92vw);
      background: #ffffff;
      border: 1px solid #dbe2ef;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.25rem;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.45;
    }
    a {
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
    .muted {
      color: #6b7280;
      font-size: 0.9rem;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Esta pantalla ya no se utiliza</h1>
    <p>
      Se ha dejado esta URL en modo compatibilidad y redirige al dashboard principal.
    </p>
    <p>
      Si no redirige automaticamente, abre <a href="/dashboard.html">dashboard.html</a>.
    </p>
    <p class="muted">Archivo original movido a /public/legacy/agentes-standalone-legacy.html</p>
  </main>
</body>
</html>
