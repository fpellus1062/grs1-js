services:
  postgres:
    image: postgres:17-alpine
    container_name: grs1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-grsuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-superpassword}
      POSTGRES_DB: ${DB_NAME:-grsdb}
    networks:
      - back_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-grsuser} -d ${DB_NAME:-grsdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - grs1_pgdata:/var/lib/postgresql/data

  migrate:
    image: postgres:17-alpine
    container_name: grs1-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-superpassword}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-grsuser}
      DB_NAME: ${DB_NAME:-grsdb}
      MIGRATIONS_DIR: /migrations
      DUMP_FILE: ${DUMP_FILE:-docker_dump.sql}
      PREFER_PLAIN_DUMP: ${PREFER_PLAIN_DUMP:-true}
      RESET_SCHEMA_BEFORE_PLAIN_DUMP: ${RESET_SCHEMA_BEFORE_PLAIN_DUMP:-false}
      APPLY_INCREMENTALS_AFTER_DUMP: ${APPLY_INCREMENTALS_AFTER_DUMP:-false}
      APPLY_INCREMENTALS_AFTER_CANONICAL: ${APPLY_INCREMENTALS_AFTER_CANONICAL:-false}
    volumes:
      - ${COMPOSE_BIND_ROOT:-.}/migrations:/migrations:ro
      - ${COMPOSE_BIND_ROOT:-.}/scripts/docker:/scripts/docker:ro
    command: ["sh", "/scripts/docker/run-migrations.sh"]
    networks:
      - back_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grs1-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env-docker
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-grsuser}
      DB_PASSWORD: ${DB_PASSWORD:-superpassword}
      DB_NAME: ${DB_NAME:-grsdb}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-for-qnap}
      DEVENGOS_WORKER_ENABLED: ${DEVENGOS_WORKER_ENABLED:-true}
      DEVENGOS_WORKER_INTERVAL_MS: ${DEVENGOS_WORKER_INTERVAL_MS:-300000}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://127.0.0.1:3000/login.html',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - back_net

  nginx:
    image: nginx:1.27-alpine
    container_name: grs1-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "443:443"  # Preparado para HTTPS futuro (certificados en volume dedicado)
    volumes:
      - ${COMPOSE_BIND_ROOT:-.}/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./docker/nginx/certs:/etc/nginx/certs:ro  # HTTPS futuro
    networks:
      - front_net
      - back_net

  adminer:
    image: adminer:latest
    container_name: grs1-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USER: ${DB_USER:-grsuser}
      ADMINER_DEFAULT_DB: ${DB_NAME:-grsdb}
    networks:
      - front_net
      - back_net

volumes:
  grs1_pgdata:

networks:
  front_net:
    driver: bridge
  back_net:
    driver: bridge
    internal: true
